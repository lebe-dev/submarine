[package]
name = "submarine"
version = "0.10.0"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "sm"
path = "src/bin/cli/main.rs"

[lib]
name = "lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"

nutype = { version = "0.5", features = ["serde"] }

clap = { version = "4.5.53", features = ["derive"], optional = true}

chrono = "0.4.42"

csv = "1.4.0"

tera = "1.20.1"
glob = "0.3"

log = "0.4.29"
log4rs = "1.4.0"

ratatui = "0.30.0"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.8"
